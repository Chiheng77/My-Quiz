<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyPulse — Quiz & Study Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    button {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: #334155;
      color: var(--text);
    }

    button.secondary:hover {
      background: #475569;
    }

    button.danger {
      background: var(--danger);
    }

    /* Quiz Runner */
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--card-border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }

    .question-title {
      font-size: 1.25rem;
      line-height: 1.4;
      margin-bottom: 1.25rem;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .option-btn {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text);
      text-align: left;
      padding: 1rem;
      border-radius: 8px;
      font-weight: 400;
    }

    .option-btn:hover:not(:disabled) {
      background: #1e293b;
      border-color: var(--accent);
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: var(--success) !important;
      color: #6ee7b7 !important;
    }

    .option-btn.incorrect {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
    }

    .explanation-box {
      background: #0f172a;
      border-left: 4px solid var(--accent);
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Forms */
    input, textarea, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .hidden {
      display: none !important;
    }

    .share-banner {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>StudyPulse</h1>
      <p>Interactive study hub — practice, build quizzes, and challenge friends</p>
    </header>

    <!-- VIEW 1: QUIZ SELECTOR -->
    <div id="view-home" class="card">
      <h2 style="margin-bottom: 1rem;">Available Quizzes</h2>
      <div id="quiz-list" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>

      <div class="btn-row" style="margin-top: 1.5rem;">
        <button onclick="showView('create')">+ Create Your Own Quiz</button>
      </div>
    </div>

    <!-- VIEW 2: QUIZ RUNNER -->
    <div id="view-runner" class="card hidden">
      <div class="quiz-meta">
        <span id="quiz-badge">Question 1/5</span>
        <span id="score-counter">Score: 0</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <h3 id="question-text" class="question-title"></h3>
      <div id="options-container" class="options-grid"></div>

      <div id="explanation" class="explanation-box hidden"></div>

      <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Question →</button>
    </div>

    <!-- VIEW 3: RESULTS -->
    <div id="view-results" class="card hidden" style="text-align: center;">
      <h2>Quiz Completed!</h2>
      <p id="result-summary" style="font-size: 1.5rem; margin: 1rem 0; font-weight: bold;"></p>
      <p id="result-message" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>

      <div class="share-banner">
        <p style="font-size: 0.9rem; margin-bottom: 0.5rem;">Share this quiz with your friends:</p>
        <button class="secondary" onclick="copyCurrentQuizLink()">🔗 Copy Share Link</button>
      </div>

      <div class="btn-row" style="justify-content: center; margin-top: 1.5rem;">
        <button onclick="restartQuiz()">Try Again</button>
        <button class="secondary" onclick="showView('home')">All Quizzes</button>
      </div>
    </div>

    <!-- VIEW 4: QUIZ CREATOR -->
    <div id="view-create" class="card hidden">
      <h2>Build a Custom Quiz</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">
        Questions are saved directly into your shareable link.
      </p>

      <label>Quiz Title</label>
      <input type="text" id="custom-title" placeholder="e.g., Final Exam Biology Review" />

      <div id="creator-questions"></div>

      <div class="btn-row">
        <button type="button" class="secondary" onclick="addQuestionField()">+ Add Question</button>
        <button type="button" onclick="saveCustomQuiz()">Generate & Save Quiz</button>
        <button type="button" class="secondary" onclick="showView('home')">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Built-in starter quizzes
    const defaultQuizzes = [
      {
        id: "web-dev",
        title: "Web Engineering Fundamentals",
        questions: [
          {
            question: "Which HTTP status code signifies that a resource was successfully created?",
            options: ["200 OK", "201 Created", "204 No Content", "301 Moved Permanently"],
            answer: 1,
            explanation: "201 Created confirms that the request was fulfilled and resulted in the creation of a new resource."
          },
          {
            question: "Which JavaScript array method creates a new array populated with results of a provided function?",
            options: ["forEach()", "filter()", "map()", "reduce()"],
            answer: 2,
            explanation: "map() transforms each element of an array and returns an entirely new array of identical length."
          },
          {
            question: "What does CSS 'box-sizing: border-box' include in the specified element's total width?",
            options: ["Content only", "Content and margins", "Content, padding, and border", "Border and margin only"],
            answer: 2,
            explanation: "With border-box, padding and border boundaries are factored inside the width/height declaration."
          }
        ]
      },
      {
        id: "gen-science",
        title: "Everyday General Science",
        questions: [
          {
            question: "What gas do plants primarily absorb during daylight photosynthesis?",
            options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Argon"],
            answer: 1,
            explanation: "Plants absorb carbon dioxide (CO2) and release oxygen as a byproduct of photosynthesis."
          },
          {
            question: "What is the hardest naturally occurring mineral on Earth?",
            options: ["Quartz", "Granite", "Diamond", "Corundum"],
            answer: 2,
            explanation: "Diamond rates 10 on the Mohs scale of mineral hardness."
          }
        ]
      }
    ];

    let quizzes = [...defaultQuizzes];
    let currentQuiz = null;
    let currentQuestionIdx = 0;
    let score = 0;

    // View Navigation
    function showView(viewName) {
      document.getElementById("view-home").classList.add("hidden");
      document.getElementById("view-runner").classList.add("hidden");
      document.getElementById("view-results").classList.add("hidden");
      document.getElementById("view-create").classList.add("hidden");
      document.getElementById(`view-${viewName}`).classList.remove("hidden");

      if (viewName === "home") renderQuizList();
    }

    // Render Home List
    function renderQuizList() {
      const listEl = document.getElementById("quiz-list");
      listEl.innerHTML = "";
      quizzes.forEach((quiz, index) => {
        const item = document.createElement("div");
        item.style.display = "flex";
        item.style.justifyContent = "space-between";
        item.style.alignItems = "center";
        item.style.padding = "0.75rem";
        item.style.background = "#0f172a";
        item.style.borderRadius = "8px";

        item.innerHTML = `
          <div>
            <strong>${quiz.title}</strong>
            <p style="font-size: 0.8rem; color: var(--text-muted);">${quiz.questions.length} Questions</p>
          </div>
          <button onclick="startQuiz(${index})">Start Quiz</button>
        `;
        listEl.appendChild(item);
      });
    }

    // Quiz Execution
    function startQuiz(index) {
      currentQuiz = quizzes[index];
      currentQuestionIdx = 0;
      score = 0;
      showView("runner");
      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQuiz.questions[currentQuestionIdx];
      document.getElementById("quiz-badge").innerText = `Question ${currentQuestionIdx + 1} of ${currentQuiz.questions.length}`;
      document.getElementById("score-counter").innerText = `Score: ${score}`;
      document.getElementById("question-text").innerText = q.question;

      const progress = ((currentQuestionIdx) / currentQuiz.questions.length) * 100;
      document.getElementById("progress-fill").style.width = `${progress}%`;

      const optionsBox = document.getElementById("options-container");
      optionsBox.innerHTML = "";

      const explanationBox = document.getElementById("explanation");
      explanationBox.classList.add("hidden");
      explanationBox.innerText = "";
      document.getElementById("next-btn").classList.add("hidden");

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsBox.appendChild(btn);
      });
    }

    function selectOption(selectedIdx) {
      const q = currentQuiz.questions[currentQuestionIdx];
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(btn => btn.disabled = true);

      if (selectedIdx === q.answer) {
        buttons[selectedIdx].classList.add("correct");
        score++;
      } else {
        buttons[selectedIdx].classList.add("incorrect");
        buttons[q.answer].classList.add("correct");
      }

      document.getElementById("score-counter").innerText = `Score: ${score}`;

      if (q.explanation) {
        const exp = document.getElementById("explanation");
        exp.innerText = q.explanation;
        exp.classList.remove("hidden");
      }

      document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
      currentQuestionIdx++;
      if (currentQuestionIdx < currentQuiz.questions.length) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      showView("results");
      const total = currentQuiz.questions.length;
      const percentage = Math.round((score / total) * 100);
      document.getElementById("result-summary").innerText = `${score} / ${total} (${percentage}%)`;

      let message = "Good effort! Review the questions and try again to hit 100%.";
      if (percentage === 100) message = "Flawless score! You mastered this topic.";
      else if (percentage >= 70) message = "Great job! Strong performance.";
      document.getElementById("result-message").innerText = message;
    }

    function restartQuiz() {
      currentQuestionIdx = 0;
      score = 0;
      showView("runner");
      renderQuestion();
    }

    // Quiz Creator Logic
    function addQuestionField() {
      const container = document.getElementById("creator-questions");
      const qIdx = container.children.length;
      const wrap = document.createElement("div");
      wrap.className = "card";
      wrap.style.background = "#0f172a";
      wrap.style.marginTop = "1rem";
      wrap.innerHTML = `
        <label>Question ${qIdx + 1}</label>
        <input type="text" class="cq-title" placeholder="Enter question statement" required />
        <label>Options (Select the radio for the correct answer)</label>
        ${[0, 1, 2, 3].map(i => `
          <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;">
            <input type="radio" name="correct-${qIdx}" value="${i}" ${i === 0 ? "checked" : ""} style="width:auto; margin:0;" />
            <input type="text" class="cq-opt-${qIdx}" placeholder="Option ${i + 1}" required style="margin:0;" />
          </div>
        `).join("")}
        <label style="margin-top:0.5rem;">Explanation (Optional)</label>
        <input type="text" class="cq-exp" placeholder="Why is this answer correct?" />
      `;
      container.appendChild(wrap);
    }

    function saveCustomQuiz() {
      const title = document.getElementById("custom-title").value.trim();
      if (!title) {
        alert("Please enter a quiz title.");
        return;
      }

      const qContainers = document.getElementById("creator-questions").children;
      if (qContainers.length === 0) {
        alert("Please add at least one question.");
        return;
      }

      const parsedQuestions = [];
      for (let i = 0; i < qContainers.length; i++) {
        const qTitle = qContainers[i].querySelector(".cq-title").value.trim();
        const options = Array.from(qContainers[i].querySelectorAll(`.cq-opt-${i}`)).map(input => input.value.trim());
        const selectedRadio = qContainers[i].querySelector(`input[name="correct-${i}"]:checked`);
        const explanation = qContainers[i].querySelector(".cq-exp").value.trim();

        if (!qTitle || options.some(opt => !opt)) {
          alert("Please fill in all question fields and options.");
          return;
        }

        parsedQuestions.push({
          question: qTitle,
          options: options,
          answer: parseInt(selectedRadio.value, 10),
          explanation: explanation
        });
      }

      const customQuiz = {
        id: "custom-" + Date.now(),
        title: title,
        questions: parsedQuestions
      };

      quizzes.push(customQuiz);
      currentQuiz = customQuiz;
      copyCurrentQuizLink();
      alert("Quiz saved! A share link has been copied to your clipboard.");
      showView("home");
    }

    // URL Sharing Encoding
    function copyCurrentQuizLink() {
      const json = JSON.stringify(currentQuiz);
      const encoded = encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
      const shareUrl = `${window.location.origin}${window.location.pathname}#quiz=${encoded}`;
      
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("Share link copied to clipboard! Anyone who opens it can take your quiz.");
      }).catch(() => {
        prompt("Copy this share link:", shareUrl);
      });
    }

    // Check URL Hash for shared quizzes on load
    window.addEventListener("DOMContentLoaded", () => {
      addQuestionField(); // pre-fill 1 question in builder
      const hash = window.location.hash;
      if (hash.startsWith("#quiz=")) {
        try {
          const raw = hash.replace("#quiz=", "");
          const decoded = decodeURIComponent(escape(atob(decodeURIComponent(raw))));
          const sharedQuiz = JSON.parse(decoded);
          quizzes.unshift(sharedQuiz);
          startQuiz(0);
          return;
        } catch (e) {
          console.error("Failed to load shared quiz from URL", e);
        }
      }
      renderQuizList();
    });
  </script>
</body>
</html>
